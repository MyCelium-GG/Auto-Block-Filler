modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
iconFile="assets/${mod_id}/icon.png"
authors="${mod_author}"
description="""${description}"""

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mycel"
# Optional so the game still starts without it: the mod then idles and tells players Mycel is missing.
type="optional"
versionRange="[${mycel_version},)"
ordering="AFTER"
side="BOTH"
